<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="右か左に曲がるだけのアリが、歩くたびにマスの色を変えて模様を描く。曲がり方のルールを変えると、渦・左右対称・三角など、まったく違う形が育つ。">
  <title>ありみち — アリが描く終わらない模様</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ありみち">
  <meta property="og:title" content="ありみち — アリが描く終わらない模様">
  <meta property="og:description" content="右か左に曲がるだけのアリが、歩くたびにマスの色を変えて模様を描く。曲がり方のルールを変えると、渦・左右対称・三角など、まったく違う形が育つ。">
  <meta property="og:url" content="https://t-of.github.io/arimichi/">
  <meta property="og:image" content="https://t-of.github.io/arimichi/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ありみち">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">ありみち</h1>
      <p class="bar__stats"><span id="steps">0</span> 歩・アリ <span id="antCount">1</span></p>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="音: オン"><svg viewBox="0 0 24 24" id="soundIcon" aria-hidden="true"></svg></button>
      <button class="icon-btn" id="helpBtn" aria-label="遊び方">?</button>
    </header>

    <div class="board" id="board">
      <canvas id="cells" width="160" height="160" aria-label="盤。タップするとアリが増える"></canvas>
      <canvas id="ants" aria-hidden="true"></canvas>
    </div>

    <section class="panel">
      <div class="controls">
        <button class="btn btn--play" id="play" aria-label="再生">▶</button>
        <button class="btn" id="step">1 歩</button>
        <button class="btn" id="reset">はじめから</button>
      </div>
      <div class="speed" id="speed" role="group" aria-label="速さ">
        <button class="btn" data-speed="0">ゆっくり</button>
        <button class="btn" data-speed="1">ふつう</button>
        <button class="btn" data-speed="2">はやい</button>
        <button class="btn" data-speed="3">いちばん</button>
      </div>

      <h2 class="label">ルール <code id="ruleText">RL</code></h2>
      <div class="cards" id="cards"></div>

      <h2 class="label">見本</h2>
      <div class="samples" id="samples"></div>

      <footer class="foot">
        <div class="foot__actions">
          <button class="pill" data-wak="install" hidden>アプリにする</button>
          <button class="pill" data-wak="share" id="share">共有</button>
        </div>
        <p class="credit"><a href="/">T.OF...</a> のアプリ</p>
      </footer>
    </section>
  </main>

  <div class="help" id="help" hidden>
    <div class="help__box" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">遊び方</h2>
      <ol>
        <li>アリは今いるマスの色を見て、決まった向きに曲がる。マスの色を次の色に変えて、1 マス進む。これをくり返す。</li>
        <li>下のルールの札をタップすると曲がり方が変わる（右・左・直＝まっすぐ・戻＝うしろ）。札を足すと色が増える。</li>
        <li>盤をタップするとアリが増える（8 匹まで）。「見本」から有名な模様も選べる。</li>
      </ol>
      <p class="help__note">もとは「ラングトンのアリ（Langton's ant）」という数学のしくみ。右と左だけのアリ（RL）も、1 万歩ほど歩くと突然まっすぐな道を作り始める。</p>
      <button class="btn btn--primary" id="helpClose">はじめる</button>
    </div>
  </div>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
